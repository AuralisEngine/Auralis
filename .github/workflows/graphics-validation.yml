name: Graphics validation

on:
  pull_request:
    branches: [master]
    paths:
      - "Auralis.slnx"
      - "README.md"
      - "src/Auralis.Graphics/**"
      - "Tests/Auralis.Graphics.Tests/**"
      - "Tests/Auralis.Graphics.OpenGL.TestSupport/**"
      - "Tests/Auralis.Graphics.OpenGL.IntegrationTests/**"
      - "Tests/Auralis.Graphics.OpenGLES.IntegrationTests/**"
      - "Benchmarks/Auralis.Graphics.OpenGL.Benchmarks/**"
      - ".github/workflows/graphics-validation.yml"
  push:
    branches: [feature/opengl-backend-silknet]

jobs:
  build-and-test:
    name: Build and run the solution test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the complete solution in Release
        run: dotnet build Auralis.slnx --configuration Release
      - name: Build hardware benchmark project in Release
        run: dotnet build Benchmarks/Auralis.Graphics.OpenGL.Benchmarks/Auralis.Graphics.OpenGL.Benchmarks.csproj --configuration Release
      - name: Verify BenchmarkDotNet benchmark discovery
        run: dotnet run --project Benchmarks/Auralis.Graphics.OpenGL.Benchmarks/Auralis.Graphics.OpenGL.Benchmarks.csproj --configuration Release -- --list flat
      - name: Run all solution tests
        run: dotnet test Auralis.slnx --configuration Release
