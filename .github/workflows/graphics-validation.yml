name: Graphics validation

on:
  pull_request:
    branches: [master]
    paths:
      - "Auralis.slnx"
      - "src/Auralis.Graphics/**"
      - "Tests/Auralis.Graphics.Tests/**"
      - ".github/workflows/graphics-validation.yml"
  push:
    branches: [feature/graphics-abstractions]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore affected test project
        run: dotnet restore Tests/Auralis.Graphics.Tests/Auralis.Graphics.Tests.csproj
      - name: Build graphics abstractions and tests
        run: dotnet build Tests/Auralis.Graphics.Tests/Auralis.Graphics.Tests.csproj --configuration Release --no-restore
      - name: Run graphics tests
        run: dotnet test Tests/Auralis.Graphics.Tests/Auralis.Graphics.Tests.csproj --configuration Release --no-build
