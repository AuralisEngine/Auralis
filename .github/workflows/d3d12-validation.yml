name: Direct3D 12 validation

on:
  pull_request:
    branches: [master]
    paths:
      - "Auralis.slnx"
      - "src/Auralis.Graphics/Auralis.Graphics.Direct3D12/**"
      - "src/Auralis.Graphics/Auralis.Graphics/**"
      - "Tests/Auralis.Graphics.Direct3D12.Tests/**"
      - "Tests/Auralis.Graphics.Tests/**"
      - ".github/workflows/d3d12-validation.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore solution
        run: dotnet restore Auralis.slnx

      - name: Audit Direct3D 12 dependency graph
        run: dotnet list src/Auralis.Graphics/Auralis.Graphics.Direct3D12/Auralis.Graphics.Direct3D12.csproj package --include-transitive

      - name: Build Direct3D 12 backend
        run: dotnet build src/Auralis.Graphics/Auralis.Graphics.Direct3D12/Auralis.Graphics.Direct3D12.csproj --configuration Release --no-restore

      - name: Build Direct3D 12 backend tests
        run: dotnet build Tests/Auralis.Graphics.Direct3D12.Tests/Auralis.Graphics.Direct3D12.Tests.csproj --configuration Release --no-restore

      - name: Build common graphics contract tests
        run: dotnet build Tests/Auralis.Graphics.Tests/Auralis.Graphics.Tests.csproj --configuration Release --no-restore

      - name: Run Direct3D 12 backend tests
        run: dotnet test Tests/Auralis.Graphics.Direct3D12.Tests/Auralis.Graphics.Direct3D12.Tests.csproj --configuration Release --no-build --no-restore

      - name: Run common graphics contract tests
        run: dotnet test Tests/Auralis.Graphics.Tests/Auralis.Graphics.Tests.csproj --configuration Release --no-build --no-restore
