name: Direct3D 12 validation

on:
  pull_request:
    branches: [master]
    paths:
      - "Auralis.slnx"
      - "src/Auralis.Graphics/Auralis.Graphics.Direct3D12/**"
      - "Tests/Auralis.Graphics.Direct3D12.Tests/**"
      - ".github/workflows/d3d12-validation.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore solution
        run: dotnet restore Auralis.slnx
      - name: Build solution
        run: dotnet build Auralis.slnx --configuration Release --no-restore
      - name: Run solution tests
        run: dotnet test Auralis.slnx --configuration Release --no-build
